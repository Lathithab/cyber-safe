<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CyberSafe Feed</title>

    <link rel="stylesheet" href="FeedStyle.css" />
    <script src="script.js"></script>
  </head>

  <body>
    <div class="header">
      <!-- Top Bar -->
      <div class="top-bar">
        <div></div>

        <!-- Logo -->
        <div class="logo-section">
          <h1>CyberSafe</h1>
        </div>

        <!-- Icons -->
        <div class="top-icons">
          <div class="notification">🔔</div>
          <button class="add-post">+</button>
        </div>
      </div>

      <!-- Page Title -->
      <div class="page-title">Feed</div>

      <!-- Search Bar -->
      <div class="search-box">
        🔍
        <input type="text" placeholder="Search posts, topics or users..." />
      </div>
    </div>

    <!-- Feed -->
    <div class="feed"></div>

    <!-- Navigation -->
    <div class="navbar">
      <a href="#" class="nav-item">
        <div class="nav-icon">🏠</div>
        Home
      </a>

      <a href="#" class="nav-item active">
        <div class="nav-icon">👥</div>
        Feed
      </a>

      <a href="#" class="nav-item">
        <div class="nav-icon">📘</div>
        Learning Modules
      </a>

      <a href="#" class="nav-item">
        <div class="nav-icon">➕</div>
        New Post
      </a>
    </div>

    <!-- JavaScript Link -->
    <script src="script.js"></script>
  </body>
</html>
