<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline — CyberSafe</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: #f6f9fd;
      color: #121a32;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(100%, 440px);
      padding: 32px;
      border: 1px solid #dce5ef;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 12px 32px rgba(36, 56, 87, .08);
      text-align: center;
    }
    .icon {
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      border-radius: 16px;
      background: #e6faff;
      color: #20b6d8;
      font-size: 28px;
      font-weight: 800;
    }
    h1 { margin: 0 0 10px; font-size: 24px; letter-spacing: -.5px; }
    p { margin: 0 0 20px; color: #65738a; font-size: 15px; line-height: 1.5; }
    .emergency {
      text-align: left;
      padding: 18px 20px;
      border: 2px solid #ff5a5f;
      border-radius: 14px;
      background: #fff4f4;
      color: #ff5158;
    }
    .emergency strong { display: block; margin-bottom: 10px; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; }
    .emergency ul { margin: 0; padding: 0; list-style: none; color: #536179; font-size: 14px; line-height: 1.7; }
    .emergency b { color: #ff5158; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">!</div>
    <h1>You're offline</h1>
    <p>CyberSafe couldn't reach the network. Check your connection and try again — these emergency numbers still work from any phone.</p>
    <div class="emergency">
      <strong>Emergency contacts</strong>
      <ul>
        <li>Childline South Africa: <b>116</b> (free, 24/7)</li>
        <li>SAPS Crime Stop: <b>08600 10111</b></li>
      </ul>
    </div>
  </main>
</body>
</html>
